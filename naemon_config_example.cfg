# ─────────────────────────────────────────────────────────────────────────────
# Naemon/Nagios configuration for S3 backup monitoring
# Place this in your Naemon config directory (e.g., /etc/naemon/conf.d/noc/)
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════
# OPTION 1: LOCAL CHECK — backup runs on the same host as Naemon
# ═══════════════════════════════════════════════════════════════════════════
# Use this when the backup script runs on the Naemon server itself.
# The plugin reads the log file directly from the filesystem.

define command {
    command_name    check_s3_backup
    command_line    $USER1$/noc/check_s3_backup.py -f "$ARG1$" -w "$ARG2$" -c "$ARG3$"
}

# Example service (local):
# define service {
#     host_name               naemon_server_1          ; <-- your Naemon host
#     service_description     S3 Backup Status
#     check_command           check_s3_backup!/var/log/naemon/s3backup/S3backup.log!48!72
#     check_period            24x7
#     check_interval           5
#     retry_interval           1
#     max_check_attempts       2
#     notification_interval    60
#     notification_options     w,c,r
#     contacts                 noc-team                 ; <-- your contact/group
#     register                 1
# }

# ═══════════════════════════════════════════════════════════════════════════
# OPTION 2: REMOTE CHECK via NRPE — backup runs on a different host
# ═══════════════════════════════════════════════════════════════════════════
# Use this when the backup script runs on a different server than Naemon.
# The plugin and log file live on the remote host; Naemon calls it via NRPE.
#
# Requirements on the remote host:
#   1. Install the plugin:   /usr/lib/naemon/plugins/noc/check_s3_backup.py
#   2. Install NRPE server:  apt install nagios-nrpe-server
#   3. Add to NRPE config:   command[check_s3_backup]=/usr/lib/naemon/plugins/noc/check_s3_backup.py -f /var/log/naemon/s3backup/S3backup.log
#   4. Allow Naemon host:    allowed_hosts=127.0.0.1,<NAEMON_SERVER_IP>
#   5. Restart NRPE:         systemctl restart nagios-nrpe-server
#
# Test from Naemon server:
#   /usr/lib/naemon/plugins/check_nrpe -H <REMOTE_HOST_IP> -c check_s3_backup

define command {
    command_name    check_s3_backup_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_s3_backup
}

